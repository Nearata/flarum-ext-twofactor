nearata-twofactor:
  admin:
    settings:
      app_number_of_generated_backup_codes: Number of generated backup codes
      email_code_expire_time_minutes: Email code expire in minutes
    permissions:
      can_enable_twofactor: Can enable Two Factor
  forum:
    email_code_sent: A code has just been sent to your email
    email_sendemail_button_label: Send Email
    settings:
      section_title: Two-Factor Authentication
      section_help: Secure your account by requiring an additional step when logging in.
      item_manage_label: Manage
      modal_close_button_label: Close
      app_item_label: Authenticator app
      app_item_description: Enter a code generated by an authenticator app like Authy/google authenticator.
      app_setup_title: Authenticator App Setup
      app_setup_password_placeholder: Password
      app_setup_passcode_placeholder: "6-digit passcode"
      app_setup_close_button_label: Close
      app_setup_invalid_passcode: Password or passcode invalid.
      app_setup_enter_code_disable: Enter the code to disable Authenticator App.
      app_setup_button_label_disable: Disable
      app_setup_success_disable: Authenticator App disabled.
      app_setup_button_label_enable: Enable
      app_setup_success_enable: Authenticator App enabled.
      app_setup_scan_qr: Scan this QR code with your two factor authenticator device to set up your account.
      app_setup_enter_code_manually: Enter key manually instead
      app_setup_backups_message: >
        Keep these recovery codes in a safe place. If you lose
        your two factor enabled device, these one-time use codes
        can be used in the listed order to log in to your account.
      app_setup_download_backups_button_label: Download
      app_setup_download_backups_file_format: |
        {website_title} | {website_url}

        Keep these backup codes somewhere safe but accessible.

        LIST OF CODES

        {codes}

        * You can only use each backup code once.
        * These codes MUST be used in the listed order.
        * These codes were generated on: {date}.
      app_setup_backups_copy_button_label: Copy
      email_item_label: Email
      email_item_description: Enter a code sent to your email.
      email_setup_title: Email Setup
      email_setup_password_placeholder: Password
      email_setup_passcode_placeholder: Passcode
      email_setup_identification_placeholder: Email
      email_setup_identification_helptext: Enter the email that you wish to receive verification codes
      email_setup_passcode_helptext: Enter the verification code from the email
      email_setup_success_enable: Email 2FA enabled
      email_setup_success_disable: Email 2FA disabled
    login:
      title: Two-Factor Authentication
      submit_button_label: Log In
      app_button_label: Authenticator App
      invalid_passcode: Invalid passcode.
      passcode_placeholder: "6-digit passcode"
      email_button_label: Email
  email:
    email_auth_subject: Your two-factor authentication code
    email_auth_body: |
      Hello {user_display_name},

      Use the following security code to complete the login step.

      Security code: <strong>{passcode}</strong></p>

      The code will expire in {expire} minutes.
    email_auth_body_plain: |
      Hello {user_display_name},

      Use the following security code to complete the login step.

      Security code: {passcode}

      The code will expire in {expire} minutes.
